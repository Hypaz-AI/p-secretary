name: p-secretary
services:
  app:
    build: .
    image: p-secretary:local
    init: true
    restart: unless-stopped
    user: "${P_SECRETARY_UID:-1000}:${P_SECRETARY_GID:-1000}"
    stop_grace_period: 120s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    tmpfs:
      - /tmp:uid=${P_SECRETARY_UID:-1000},gid=${P_SECRETARY_GID:-1000},mode=1777
    environment:
      P_SECRETARY_CONTAINER: "1"
      P_SECRETARY_CONFIG_FILE: /config/secretary.env
      DATA_DIR: /var/lib/p-secretary
      INVOICE_DIR: /var/lib/p-secretary/invoices
      TELEGRAM_USER_SESSION: /var/lib/p-secretary/telegram_account/personal.session
      DASHBOARD_CREDENTIAL_FILE: /config/dashboard.json
      DASHBOARD_BIND: 0.0.0.0
      DASHBOARD_PORT: "8080"
    volumes:
      - ${P_SECRETARY_HOME:?Use the launcher}/config:/config
      - ${P_SECRETARY_HOME:?Use the launcher}/data:/var/lib/p-secretary
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/healthz', headers={'Host':'localhost'}), timeout=3); assert r.status == 200"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
  db:
    image: postgres:16-bookworm
    profiles: [local]
    env_file: ${P_SECRETARY_HOME:?Use the launcher}/config/postgres.env
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U secretary -d secretary"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 120s
volumes:
  postgres: