name: Docker packaging
on:
  push:
  pull_request:
jobs:
  offline-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Explicit agent, dashboard and AI budget security contracts
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            PI_SECRETARY_CONFIG_FILE=/dev/null DATA_DIR="$(mktemp -d)" \
            python -m unittest -v tests.agent.test_agent_sqlguard tests.agent.test_agent_fsbox \
              tests.agent.test_agent_gateway tests.agent.test_agent_owner \
              tests.dashboard.test_dashboard_api tests.core.test_secretary_budget \
              tests.core.test_secretary_policy
      - name: Full offline discovery (no deployment dotenv or inherited credentials)
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            PI_SECRETARY_CONFIG_FILE=/dev/null DATA_DIR="$(mktemp -d)" \
            python -m unittest discover -v
      - run: sh -n pi-secretary
      - run: node --check secretary/dashboard/static/app.js
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secretary_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: secretary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U secretary_test -d secretary_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
          --volume /tmp/pg-test-sock:/var/run/postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full discovery with disposable PostgreSQL, never DATABASE_URL
        env:
          TEST_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          mkdir -p /tmp/pg-test-sock
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            PI_SECRETARY_CONFIG_FILE=/dev/null DATA_DIR="$(mktemp -d)" \
            PI_SECRETARY_TEST_DATABASE_URL="host=/tmp/pg-test-sock dbname=secretary_test user=secretary_test password=disposable-ci-only" \
            python -m unittest discover -v